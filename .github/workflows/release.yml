# @orcastrate
# template: rust/release
# params:
#   library_only: true
#   runner_os: windows-latest
# @end-orcastrate

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:

  TAG_NAME: ${{ github.ref_name }}
  PUBLISH_RELEASE: "false"

jobs:
  verify:
    name: Verify release
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Validate release tag and publishing token
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Select a stable vX.Y.Z release tag.'
            exit 1
          fi

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify Cargo version matches tag
        run: |
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"

          version="$(jq -er --arg manifest 'Cargo.toml' \
            '.packages[] | select((.manifest_path | gsub("\\\\"; "/")) == ((env.GITHUB_WORKSPACE | gsub("\\\\"; "/")) + "/" + $manifest)) | .version' <<< "$metadata")"
          if [[ "$version" != "${TAG_NAME#v}" ]]; then
            printf '::error::Cargo version %s does not match tag %s.\n' "$version" "$TAG_NAME"
            exit 1
          fi


      - name: Format, lint, and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features


  release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create release App token
        id: release-token
        uses: actions/create-github-app-token@0f859bf9e69e887678d5bbfbee594437cb440ffe # v2.1.0
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --current --strip header --output CHANGELOG.md



      - name: Create or update draft, then publish if enabled
        env:
          # Publishing with GITHUB_TOKEN would suppress release-triggered workflows.
          GH_TOKEN: ${{ env.PUBLISH_RELEASE == 'true' && steps.release-token.outputs.token || github.token }}
        run: |
          release_state="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -r --arg tag "$TAG_NAME" '.[] | select(.tag_name == $tag) | .draft')"
          if [[ "$release_state" == "false" ]]; then
            echo 'Release is already published; leaving it unchanged.'
            exit 0
          fi
          if [[ "$release_state" == "true" ]]; then

            gh release edit "$TAG_NAME" --notes-file CHANGELOG.md
          else
            gh release create "$TAG_NAME" --verify-tag --draft \
              --title "${TAG_NAME#v}" --notes-file CHANGELOG.md
          fi
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            gh release edit "$TAG_NAME" --draft=false
          fi
